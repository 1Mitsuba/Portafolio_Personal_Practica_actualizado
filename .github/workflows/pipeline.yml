name: Portafolio CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pruebas unitarias, integración y E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITE_DOMAIN: localhost
      TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Pruebas unitarias frontend
        working-directory: frontend
        run: npm run test:unit
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias backend
        run: python -m pip install -r backend/requirements.txt
      - name: Pruebas unitarias e integración backend
        working-directory: backend
        run: PYTHONPATH=. pytest -m "unit or integration" -v
      - name: Instalar navegador para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Levantar aplicación completa para E2E
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local up --build -d
      - name: Esperar a que la aplicación esté disponible
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local logs
          exit 1
      - name: Ejecutar pruebas E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Mostrar logs si falla el pipeline
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local logs
      - name: Limpiar contenedores de prueba
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local down -v

  publish-and-deploy:
    name: Docker Hub, OCI, Ansible y Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Detectar IP temporal del runner para SSH
        id: runner-ip
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "::add-mask::$ip"
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
      - name: Validar configuración requerida
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_IMAGE_OCID: ${{ vars.OCI_IMAGE_OCID }}
          OCI_ADMIN_CIDR: ${{ vars.OCI_ADMIN_CIDR }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$OCI_TENANCY_OCID" ] || [ -z "$OCI_USER_OCID" ] || [ -z "$OCI_FINGERPRINT" ] || [ -z "$OCI_PRIVATE_KEY" ] || [ -z "$OCI_COMPARTMENT_OCID" ] || [ -z "$OCI_SSH_PUBLIC_KEY" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SUPABASE_DATABASE_URL" ] || [ -z "$OCI_REGION" ] || [ -z "$OCI_IMAGE_OCID" ] || [ -z "$OCI_ADMIN_CIDR" ] || [ -z "$OCI_NAMESPACE" ] || [ -z "$TF_STATE_BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Completa los secretos y variables de GitHub indicados en README antes del despliegue."
            exit 1
          fi
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Preparar QEMU para imágenes ARM64
        uses: docker/setup-qemu-action@v3
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:latest
      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-api:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-api:latest
      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Inicializar y aplicar infraestructura OCI
        id: terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region: ${{ vars.OCI_REGION }}
          TF_VAR_oci_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_oci_image_ocid: ${{ vars.OCI_IMAGE_OCID }}
          TF_VAR_oci_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TF_VAR_oci_admin_cidr: ${{ vars.OCI_ADMIN_CIDR }}
          TF_VAR_deployment_runner_cidr: ${{ steps.runner-ip.outputs.cidr }}
        run: |
          install -d -m 700 "$HOME/.oci"
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          printf '[DEFAULT]\nuser=%s\ntenancy=%s\nregion=%s\nfingerprint=%s\nkey_file=%s\n' \
            "$OCI_USER_OCID" "$OCI_TENANCY_OCID" "$OCI_REGION" "$OCI_FINGERPRINT" "$RUNNER_TEMP/oci_api_key.pem" > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="key=portafolio/terraform.tfstate" \
            -backend-config="region=${{ vars.OCI_REGION }}"
          terraform validate
          terraform apply -input=false -auto-approve
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Preparar Ansible
        run: |
          python -m pip install ansible==10.7.0
          ansible-galaxy collection install community.general
          install -m 600 /dev/null "$RUNNER_TEMP/portfolio_ssh_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/portfolio_ssh_key"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configurar VM y desplegar contenedores
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/portfolio_ssh_key
          OCI_ADMIN_CIDR: ${{ vars.OCI_ADMIN_CIDR }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
          PORTFOLIO_DOMAIN: ":80"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: >-
          ansible-playbook
          -i '${{ steps.terraform.outputs.public_ip }},'
          -u ubuntu
          ansible/playbook.yml
          --private-key "$ANSIBLE_PRIVATE_KEY_FILE"
      - name: Construir y publicar Cloudflare Worker en workers.dev
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: http://${{ steps.terraform.outputs.public_ip }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          cd ..
          npx --yes wrangler@4.52.1 deploy --config wrangler.jsonc --var "API_ORIGIN:$API_ORIGIN"
          subdomain=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$subdomain" || { echo "::error::Configura el subdominio gratuito workers.dev de Cloudflare."; exit 1; }
          url="https://portafolio-wendy.$subdomain.workers.dev"
          echo "URL publicada: $url"
          echo "### Portafolio publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..36}; do
            if curl --fail --silent "$url/api/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::El Worker no respondió correctamente en $url/api/health."
          exit 1
